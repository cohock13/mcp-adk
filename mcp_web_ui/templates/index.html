<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Creator - Web UI</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <!-- トップアラート -->
    <div class="top-alert" id="topAlert">
        <span class="alert-message" id="alertMessage"></span>
        <button class="alert-action" id="alertAction">リセット</button>
        <button class="alert-close" id="alertClose">&times;</button>
    </div>

    <div class="container">
        <!-- サイドバー -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🔧 MCP Creator</h2>
            </div>
            <div class="sidebar-content">
                <div class="section-title">MCPサーバー</div>
                <ul class="server-list" id="serverList">
                    <li class="text-secondary text-center" style="padding: 20px;">読み込み中...</li>
                </ul>
                
                <button class="btn btn-secondary" style="width: 100%; margin-top: 16px;" onclick="openNewServerModal()">
                    ➕ 新しいサーバーを作成
                </button>
            </div>
        </aside>
        
        <!-- メインコンテンツ -->
        <main class="main-content">
            <!-- チャットヘッダー -->
            <header class="chat-header">
                <h1 class="chat-title">MCP Creator Agent</h1>
                <div>
                    <span class="model-badge" id="modelBadge">読み込み中...</span>
                    <button class="btn btn-secondary" id="resetBtn" style="margin-left: 12px;">
                        🔄 リセット
                    </button>
                </div>
            </header>
            
            <!-- チャットエリア -->
            <div class="chat-area" id="chatArea">
                <div class="welcome-message">
                    <h3>🔧 MCP Creator Agent</h3>
                    <p>MCPサーバーを作成・管理するAIエージェントです。<br>チャットで指示を出すとMCPサーバーを自動生成します。</p>
                    <div class="suggestions">
                        <div class="suggestion">四則演算のMCPサーバーを作成して</div>
                        <div class="suggestion">天気取得APIのMCPを作って</div>
                        <div class="suggestion">MCPサーバーの一覧を見せて</div>
                    </div>
                </div>
            </div>
            
            <!-- 入力エリア -->
            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <textarea 
                        class="chat-input" 
                        id="chatInput" 
                        placeholder="メッセージを入力... (Enterで送信、Shift+Enterで改行)"
                        rows="1"
                    ></textarea>
                    <button class="btn btn-primary" id="sendBtn">
                        送信 ➤
                    </button>
                </div>
            </div>
        </main>
    </div>
    
    <!-- コードエディタモーダル -->
    <div class="modal-overlay" id="codeModal">
        <div class="modal">
            <div class="modal-header">
                <h3>MCPサーバーコード</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">サーバー名</label>
                    <input type="text" class="form-input" id="serverName" placeholder="例: calculator">
                </div>
                <div class="form-group">
                    <label class="form-label">コード</label>
                    <textarea class="code-editor" id="serverCode"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-close">キャンセル</button>
                <button class="btn btn-primary" id="saveServerBtn">保存</button>
            </div>
        </div>
    </div>
    
    <!-- ツール承認モーダル -->
    <div class="modal-overlay" id="approvalModal">
        <div class="modal approval-modal">
            <div class="modal-header approval-header">
                <h3>🔧 ツール実行の承認</h3>
            </div>
            <div class="modal-body">
                <p class="approval-description">AIエージェントが以下のツールを実行しようとしています：</p>
                <div class="approval-details">
                    <div class="form-group">
                        <label class="form-label">ツール名</label>
                        <div class="approval-tool-name" id="approvalToolName">-</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">引数</label>
                        <pre class="approval-args" id="approvalArgs">{}</pre>
                    </div>
                </div>
            </div>
            <div class="modal-footer approval-footer">
                <button class="btn btn-danger" id="rejectBtn">❌ 拒否</button>
                <button class="btn btn-success" id="approveBtn">✅ 承認</button>
            </div>
        </div>
    </div>
    
    <script src="/static/app.js"></script>
</body>
</html>
