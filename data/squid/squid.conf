http_port 3128

# ===== 動的生成 ACL =====
acl mcp_weather_api_fetcher src 172.20.0.10
acl whitelist_weather_api_fetcher dstdomain "/etc/squid/whitelist/weather_api_fetcher.txt"

# ===== アクセス制御 =====
http_access allow mcp_weather_api_fetcher whitelist_weather_api_fetcher

# デフォルト拒否
http_access deny all

# ログ設定
access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log
cache deny all
