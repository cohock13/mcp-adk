http_port 3128

# ===== 動的生成 ACL =====
acl mcp_weather_api_server src 172.20.0.10
acl whitelist_weather_api_server dstdomain "/etc/squid/whitelist/weather_api_server.txt"

# ===== アクセス制御 =====
http_access allow mcp_weather_api_server whitelist_weather_api_server

# デフォルト拒否
http_access deny all

# ログ設定
access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log
cache deny all
